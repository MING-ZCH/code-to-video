<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Code-to-Video studio</title>
<style>
  /* local font: no network, so every machine renders the same letters */
  @font-face { font-family: "Permanent Marker"; font-display: block;
    src: url("node_modules/@fontsource/permanent-marker/files/permanent-marker-latin-400-normal.woff2") format("woff2"); }
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="11" step="0.0417" value="0"><span id="tt">loading…</span><span id="proj"></span></div>
</main>
<script>
  // Project loader. studio.html?project=<name> loads projects/<name>/project.js first (it defines PROJECT), then the
  // shared engine (read-only for scene authors), then the project's scene files in PROJECT.scenes order.
  // document.write keeps the scripts synchronous and ordered, and works from file:// without a server.
  window.PROJECT_NAME = new URLSearchParams(location.search).get('project') || 'demo';
  document.write(`<script src="projects/${PROJECT_NAME}/project.js"><\/script>`);
</script>
<script>
  if (typeof PROJECT === 'undefined') document.body.insertAdjacentHTML('afterbegin', `<p style="color:#f88">no project "${PROJECT_NAME}"</p>`);
  for (const f of ['core', 'clawd', 'timeline', 'sheets', 'shaders', 'overlay', 'audio', 'doc']) document.write(`<script src="engine/${f}.js"><\/script>`);
  for (const f of PROJECT.scenes || []) document.write(`<script src="projects/${PROJECT_NAME}/scenes/${f}"><\/script>`);
</script>
<script>
  // studio.html?project=demo&loop=emotions scrubs a standalone loop instead of the video.
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
  document.getElementById('proj').textContent = PROJECT_NAME;
</script>
</body>
</html>
