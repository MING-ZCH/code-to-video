name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-wqy-microhei
      - run: npm ci --no-audit --no-fund
      # fast tests: syntax, parsers, audio analysis, fixtures (no Chrome)
      - run: npm test
      # Chrome tests: rule-breaking check fixture, glow determinism, MCP smoke, failure replays (software WebGL)
      - run: npx -y @puppeteer/browsers install chrome-headless-shell@stable --path ~/.cache/c2v-chrome
      - run: |
          export CHROME_PATH=$(find ~/.cache/c2v-chrome -type f -name chrome-headless-shell | head -1)
          node tests/run.mjs --soft-gl
          C2V_SOFT_GL=1 node tests/mcp-smoke.mjs
          node tests/replay.mjs --soft-gl
